name: Build IWX PANEL APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-panel/**'
      - '.github/workflows/build-panel-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build IWX PANEL APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        run: |
          cd android-panel
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-panel-gradle-${{ hashFiles('android-panel/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-panel-gradle-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK
        run: |
          cd android-panel
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Re-sign APK dengan Release Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/androidconnector.p12
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name "apksigner" | sort -V | tail -1)
          $APKSIGNER sign \
            --ks /tmp/androidconnector.p12 \
            --ks-type PKCS12 \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out android-panel/app/build/outputs/apk/debug/app-debug-signed.apk \
            android-panel/app/build/outputs/apk/debug/app-debug.apk
          echo "✅ Re-sign selesai"
          $APKSIGNER verify --print-certs android-panel/app/build/outputs/apk/debug/app-debug-signed.apk | head -3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IwxPanel-signed-${{ github.sha }}
          path: android-panel/app/build/outputs/apk/debug/app-debug-signed.apk
          retention-days: 30

      - name: Summary
        run: |
          echo "## ✅ IWX PANEL APK Built" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | com.iwx.panel |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **URL** | Fetched from android-config.json |" >> $GITHUB_STEP_SUMMARY
          ls -lh android-panel/app/build/outputs/apk/debug/
