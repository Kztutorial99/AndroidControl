name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ─── DEBUG BUILD ─────────────────────────────────────────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }
      - run: cd android && gradle wrapper --gradle-version 8.4 && chmod +x gradlew
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses || true
      - run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidConnector-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ─── RELEASE BUILD + CDC v2 ENCRYPT + SIGN ────────────────────────────────
  build-release:
    name: Build & Sign Release APK (+ CDC v2 DEX Encrypt)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }

      - run: cd android && gradle wrapper --gradle-version 8.4 && chmod +x gradlew

      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses || true

      # ── Decode keystore & ambil cert SHA256 ──────────────────────────────
      - name: Decode Keystore + Extract Cert SHA256
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/androidconnector.p12

          keytool -exportcert \
            -keystore android/app/androidconnector.p12 \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            -file /tmp/cert.der 2>/dev/null

          CERT_SHA256=$(openssl dgst -sha256 -hex /tmp/cert.der | awk '{print $2}')
          echo "CERT_SHA256=$CERT_SHA256" >> $GITHUB_ENV
          echo "✅ Cert SHA256: ${CERT_SHA256:0:16}..."

      # ── Pass 1: Build release untuk hasilkan DEX ─────────────────────────
      - name: Pass 1 — Compile & Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/androidconnector.p12" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          echo "✅ Pass 1 complete — DEX compiled"

      # ── CDC v2: Encrypt DEX, inject ke assets, rebuild ───────────────────
      - name: CDC v2 — Encrypt DEX & Inject ke Assets
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"

          # Ekstrak classes.dex dari APK
          unzip -p "$APK" classes.dex > /tmp/classes.dex
          echo "📦 DEX size: $(wc -c < /tmp/classes.dex) bytes"

          # Pastikan folder assets ada sebelum nulis file
          mkdir -p android/app/src/main/assets/

          # Encrypt dengan CDC v2
          python3 android/scripts/enc_dex.py \
            /tmp/classes.dex \
            "$CERT_SHA256" \
            "com.android.services" \
            android/app/src/main/assets/classes.dex.enc

          echo "✅ CDC v2 encrypted → assets/classes.dex.enc"
          echo "   $(wc -c < android/app/src/main/assets/classes.dex.enc) bytes"

      # ── Pass 2: Rebuild APK dengan encrypted DEX di assets ───────────────
      - name: Pass 2 — Rebuild APK (include classes.dex.enc in assets)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/androidconnector.p12" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          echo "✅ Pass 2 complete — APK with CDC encrypted DEX"

      # ── Copy + upload ─────────────────────────────────────────────────────
      - name: Package Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             dist/AndroidConnector-release-signed.apk
          # Bersihkan encrypted DEX dari src (agar tidak ter-commit)
          rm -f android/app/src/main/assets/classes.dex.enc

      - uses: actions/upload-artifact@v4
        with:
          name: AndroidConnector-release-signed-${{ github.sha }}
          path: dist/AndroidConnector-release-signed.apk
          retention-days: 90

      - name: Build Summary
        run: |
          echo "## ✅ Build Berhasil" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **APK** | AndroidConnector-release-signed.apk |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **DEX Enc** | ✅ CDC v2 — SHA256-chain stream cipher |" >> $GITHUB_STEP_SUMMARY
          echo "| **Key Binding** | cert SHA256 + package name |" >> $GITHUB_STEP_SUMMARY
          echo "| **R8** | ✅ Aktif |" >> $GITHUB_STEP_SUMMARY
          echo "| **Signed** | ✅ V2 + V3 |" >> $GITHUB_STEP_SUMMARY
          ls -lh android/app/build/outputs/apk/release/
