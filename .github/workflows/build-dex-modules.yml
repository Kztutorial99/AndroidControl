name: Build Dex Modules (DISABLED)
# =============================================================================
# ℹ️  Workflow ini DISABLED — semua module (SMS, Calls, Contacts, Location,
#     Media, Accounts, FileManager) sudah di-inline langsung ke APK utama.
#     DexModuleLoader sudah dihapus. Tidak perlu build/encrypt dex terpisah.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Workflow ini disabled. Module sudah inline di APK.'
        required: false

jobs:
  disabled:
    name: Workflow Disabled
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "⚠️ Workflow ini sudah tidak diperlukan."
          echo "Semua module (SMS, Calls, Contacts, Location, Media, Accounts, Files)"
          echo "sudah diinline langsung ke APK utama di:"
          echo "  android/app/src/main/kotlin/com/nexlink/bridge/modules/"
          echo ""
          echo "DexModuleLoader sudah dihapus dari codebase."
          exit 0
