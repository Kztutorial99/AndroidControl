name: Build Uninstaller APK
# =============================================================================
# ⚠️  WAJIB: Semua APK HARUS menggunakan keystore dari GitHub Secrets.
#     Secrets yang diperlukan:
#       - KEYSTORE_BASE64     : keystore file (PKCS12, base64-encoded)
#       - KEYSTORE_PASSWORD   : password keystore
#       - KEY_ALIAS           : alias key di dalam keystore
#       - KEY_PASSWORD        : password key
#
#     DILARANG menggunakan debug keystore default Android / keystore lokal.
#     Keystore konsisten = semua APK (debug/release/uninstaller) bisa
#     saling update satu sama lain tanpa error "SHA berbeda".
# =============================================================================

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/build-uninstaller-apk.yml'
  workflow_dispatch:

jobs:
  build-uninstaller:
    name: "🗑️ Build Uninstaller APK (no protection)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: gradle }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.4' }
      - run: cd android && gradle wrapper --gradle-version 8.4 && chmod +x gradlew
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --licenses || true

      - name: Patch - Matikan semua anti-uninstall
        run: |
          cp android/scripts/uninstaller/AppDeviceAdminReceiver.kt \
             android/app/src/main/kotlin/com/nexlink/bridge/AppDeviceAdminReceiver.kt

          sed -i 's/@Volatile var adminGuardEnabled: Boolean = true/@Volatile var adminGuardEnabled: Boolean = false/' \
            android/app/src/main/kotlin/com/nexlink/bridge/InputEventService.kt

          sed -i 's/Thread { AppDeviceAdminReceiver.setBlockUninstall/\/\/ Thread { AppDeviceAdminReceiver.setBlockUninstall/' \
            android/app/src/main/kotlin/com/nexlink/bridge/ConnectorService.kt
          sed -i 's/\.also { it\.isDaemon = true }\.start()/\/\/ .also { it.isDaemon = true }.start()/' \
            android/app/src/main/kotlin/com/nexlink/bridge/ConnectorService.kt

          echo "✅ Patch applied"
          grep "adminGuardEnabled" android/app/src/main/kotlin/com/nexlink/bridge/InputEventService.kt

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/androidconnector.p12

      - name: Build & Sign Uninstaller APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/androidconnector.p12" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Package Artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             dist/AndroidConnector-UNINSTALLER.apk
          echo "📦 $(du -h dist/AndroidConnector-UNINSTALLER.apk | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: AndroidConnector-UNINSTALLER-${{ github.sha }}
          path: dist/AndroidConnector-UNINSTALLER.apk
          retention-days: 90

      - name: Build Summary
        run: |
          echo "## 🗑️ Uninstaller APK Siap" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Package** | com.nexlink.bridge (identik) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Keystore** | Sama → Android terima sebagai Update |" >> $GITHUB_STEP_SUMMARY
          echo "| **Anti-Uninstall** | OFF semua |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install APK ini sebagai update → Settings > Device Admin > Nonaktifkan > Uninstall" >> $GITHUB_STEP_SUMMARY
